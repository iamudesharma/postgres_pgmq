name: postgres_pgmq
description: >-
  Idiomatic Dart client for Postgres Message Queue (PGMQ) on package:postgres.
  Wraps any Session (Connection, Pool, TxSession) with the full PGMQ SQL API.
version: 0.0.2
repository: https://github.com/iamudesharma/postgres_pgmq
issue_tracker: https://github.com/iamudesharma/postgres_pgmq/issues
homepage: https://github.com/iamudesharma/postgres_pgmq

environment:
  sdk: ^3.4.0

dependencies:
  postgres: ^3.5.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

topics:
  - postgres
  - pgmq
  - queue
  - messaging
