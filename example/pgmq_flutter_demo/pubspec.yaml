name: pgmq_flutter_demo
description: >-
  Flutter demo and verification app for the postgres_pgmq package.
  Connects to a PGMQ database and exercises the full client API.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  postgres: ^3.5.0
  postgres_pgmq:
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
