services:
  postgres:
    image: ghcr.io/pgmq/pg18-pgmq:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Override the host port when 5432 is taken locally, e.g.:
      # PGMQ_HOST_PORT=5434 docker compose up -d
      - '${PGMQ_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 30
